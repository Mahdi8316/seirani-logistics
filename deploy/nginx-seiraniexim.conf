server {
    server_name seiraniexim.ir www.seiraniexim.ir;

    if ($host = www.seiraniexim.ir) {
        return 301 https://seiraniexim.ir$request_uri;
    }

    root /var/www/seiraniexim;
    index index.php index.html;
    access_log /var/log/nginx/seiraniexim.access.log;
    error_log /var/log/nginx/seiraniexim.error.log;
    client_max_body_size 2m;
    error_page 404 /404.php;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /blog {
        rewrite ^ /blog.php last;
    }
    location = /blog/ {
        return 301 /blog;
    }
    location ~ ^/blog/([A-Za-z0-9-]+)/$ {
        return 301 /blog/$1;
    }
    location ~ ^/blog/([A-Za-z0-9-]+)$ {
        rewrite ^/blog/([A-Za-z0-9-]+)/?$ /post.php?slug=$1 last;
    }
    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }
    location = /404.php {
        internal;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-seiraniexim.sock;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-seiraniexim.sock;
    }
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        try_files $uri =404;
    }
    location ^~ /inc/ { deny all; }
    location ~ /\. { deny all; }
    location ~* \.(jpg|jpeg|png|webp|svg|ico|css|js|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/seiraniexim.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seiraniexim.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name seiraniexim.ir www.seiraniexim.ir;
    return 301 https://seiraniexim.ir$request_uri;
}
